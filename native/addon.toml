abi = 1
entry = "taida_addon_get_v1"
package = "taida-lang/terminal"
library = "taida_lang_terminal"

[functions]
terminalSize = 0
readKey = 0
isTerminal = 1
rawModeEnter = 0
rawModeLeave = 0
readEvent = 0
write = 1
# Renderer native entries (append-only)
bufferPut = 4
bufferWrite = 5
bufferFillRect = 6
bufferClear = 2
bufferDiff = 2
renderFull = 1
renderFrame = 2
renderOps = 1
# Sub-buffer blit (append-only)
bufferBlit = 4
# Buffer allocation (append-only)
bufferNew = 2
bufferResize = 4
# Unicode width helpers (append-only)
measureGrapheme = 1
displayWidth = 1
normalizeCellText = 1
truncateWidth = 2
padWidth = 2

[library.prebuild]
url = "https://github.com/taida-lang/terminal/releases/download/{version}/lib{name}-{target}.{ext}"
# SHA-256 digests live in `addon.lock.toml` (CI-generated, attached to
# each GitHub Release). `taida install` falls back to fetching that
# file when `[library.prebuild.targets]` is absent or missing the
# host triple.
